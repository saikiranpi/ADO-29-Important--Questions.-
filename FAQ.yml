25. How variable groups are used in a YAML Pipeline?
A: Variable groups are used to store values that you want to use across multiple pipelines. Variable groups can be linked to a pipeline and the variables in the variable group can be used in the pipeline. Variable groups are useful for storing sensitive information like passwords and secrets.

Variable groups will also allow to integrate with Azure Key Vault for password versioning.

We can define variable groups based on the environment like Dev, QA, Prod and use them in the pipeline.

26. How to save from password changes in a YAML Pipeline (or) How can I version control secrets in a YAML Pipeline?
A: Integration with Azure Key Vault can be used to save password changes in a YAML Pipeline. Azure Key Vault is a cloud service for securely storing and managing secrets. Azure Key Vault can be used to store and manage application secrets, keys, and certificates.

27. What is a Mono-Repo? (or) If I have multiple microservices, how to keep everything in a single repository?
A: You can have folder is for each microservice in a single repository. This is called a Mono-Repo. A Mono-Repo is a single repository that contains multiple projects or microservices. A Mono-Repo can be used to store all the projects or microservices in a single repository.
MicroServiceA
MicroServiceB
MicroServiceC

28. How can I make sure if there is a code change in a specific folder, only that microservice is built and deployed?
A: In this scenario, we have root pipeline which will exclude the microservice folder as shown below.
trigger:
  branches:
    include:
     - development
     - uat
     - production
    exclude: ["master","feature*","releases/*"]
  paths:
    exclude:
    - demofile-exclude.txt
    - MicroServiceA/*
    - MicroServiceB/*
    - MicroServiceC/*

Then we need to create a pipeline for each microservice which will include only the microservice folder as shown below. 
/MicroServiceA/azure-pipelines-a.yml
/MicroServiceA/azure-pipelines-b.yml
/MicroServiceA/azure-pipelines-c.yml

In each pipleine we have below trigger.
trigger:
  branches:
    include:
    - development
    - uat
    - production
  paths:
    include:
    - 'MicroServiceA/*'

29. How can we target specific agents in a YAML Pipeline?
A: Every agent has two sets of capabilities: system capabilities and user-defined capabilities. 
System capabilities are automatically discovered by Azure Pipelines. 
User-defined capabilities are defined by the agent administrator. You can use these capabilities to target specific agents in a YAML Pipeline.

We can use the keywork demands to target specific agents in a YAML Pipeline.
pool: 
  name: LinuxAgentPool
  demands:
  - Terraform -equals Yes #User-defined capability
  - Agent.Name -equals $(Agent.Name) #System capability